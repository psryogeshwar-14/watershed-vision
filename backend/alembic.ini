# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration for WatershedVision database migrations.
#
# To use:
#   1. Copy .env.example → .env and set DATABASE_URL
#   2. alembic init alembic      (only if alembic/ directory doesn't exist)
#   3. alembic revision --autogenerate -m "initial schema"
#   4. alembic upgrade head
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
# Path to the Alembic migration scripts directory
script_location = alembic

# Template for new migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend sys.path with this directory so app modules are importable
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Allow truncating long revision slugs in file names
truncate_slug_length = 40

# Target metadata is set in alembic/env.py (imported from app.core.database)
# This value is overridden by env.py at runtime
sqlalchemy.url = %(DATABASE_URL)s


# ── Alembic logging ───────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
